<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Images</title>
    <link rel="stylesheet" href="styles/responsive-images.css" />
</head>

<body>
    <main>
        <div class="hero">
            <picture>
                <source type="image/webp" srcset="images/hero-large.webp" media="(min-width: 1000px)">

                <source type="image/webp" srcset="images/hero-medium.webp" media="(min-width: 500px)">
                
                <img src="images/hero-small.webp" alt="Temple exterior at sunset" width="1500" height="750" decoding="async" />
            </picture>

        </div>
    </main>
</body>

</html>
