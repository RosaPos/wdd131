<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papantla, Veracruz</title>
    <link rel="stylesheet" href="styles/place.css">
    <script defer src="scripts/place.js"></script>
</head>

<body>
    <header>
        <h1>Papantla, Veracruz</h1>
    </header>

    <main>
        <div class="hero-area">
            <picture class="hero">
                <source media="(min-width: 768px)" srcset="images/papantla-hero-large.webp">
                <img src="images/papantla-hero-small.webp" alt="View of Papantla, Veracruz" width="1200" height="600"
                    loading="lazy">
            </picture>

            <section class="card data">
                <h2>Data</h2>
                <ul>
                    <li><strong>State:</strong> Veracruz</li>
                    <li><strong>Country:</strong> Mexico</li>
                    <li><strong>Language:</strong> Spanish</li>
                    <li><strong>Time zone:</strong> GMT-6</li>
                </ul>
            </section>

            <section class="card weather">
                <h2 class="weather-title">Weather</h2>

                <img class="weather-icon" src="images/weather-sun.svg" alt="Sunny weather icon" width="64" height="64">

                <p>Temperature: <span id="temperature">28</span> °C</p>
                <p>Condition: Sunny</p>
                <p>Wind: <span id="windspeed">10</span> km/h</p>
                <p>Wind Chill: <span id="windchill">N/A</span></p>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Papantla, Veracruz, Mexico</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
