<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script defer src="scripts/lazyload.js"></script>
</head>

<body>

    <main>
        <h1>Lazy Loading Example</h1>

        <img src="images/photo1.jpg" alt="3D printed Raccoon keychain" loading="lazy" width="600" height="600">
        <img src="images/photo2.jpg" alt="3D printed Crocodile keychain" loading="lazy" width="600" height="600">
        <img src="images/photo3.jpg" alt="3D printed Fox keychain" loading="lazy" width="600" height="600">
        <img src="images/photo4.jpg" alt="3D printed Owl keychain" loading="lazy" width="600" height="600">
        <img src="images/photo5.jpg" alt="3D printed Turtle keychain" loading="lazy" width="600" height="600">
        <img src="images/photo6.jpg" alt="3D printed Dog keychain" loading="lazy" width="600" height="600">

    </main>

    <footer>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
